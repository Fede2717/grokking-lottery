# Magnitude pruning configuration (IMP for Exp B; one-shot magnitude pruning for
# Exp C). One-shot uses the same target_sparsities list.

method: "imp"            # "imp" (Exp B primary) | "one_shot" (Exp C / ablation)

# Sparsity levels. Each level = one full pruning + grokking run.
target_sparsities:
  - 0.0     # dense baseline
  - 0.2
  - 0.5
  - 0.7
  - 0.8
  - 0.9
  - 0.95

# IMP schedule
prune_rate_per_round: 0.20   # fraction of active weights pruned per round
# imp_steps_per_round: training updates between IMP rounds.
# With full-batch training, one update uses the entire training split.
# Whether 400 updates precede grokking is empirical and must not be assumed.
imp_steps_per_round:  400

# Weight rewinding strategy. In run_imp, AdamW state persists across rounds.
rewind_to_init: true         # True = rewind to W_0 (step-0 weights on disk)

# Fourier analysis at key checkpoints (light)
compute_fourier: true
fourier_top_k:  5
