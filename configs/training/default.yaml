# Default training regime: full-batch AdamW with the hyperparameters used by the
# experiment drivers.

# Optimizer
optimizer:    "adamw"   # the only implemented optimizer
lr:           1.0e-3
weight_decay: 1.0
beta1:        0.9
beta2:        0.98
eps:          1.0e-8

# Set a float to enable gradient clipping.
max_grad_norm: null

# Batching
full_batch:  true        # full-batch GD: one step == one pass over the train set
batch_size:  512         # used when full_batch=false (see training/minibatch)

# Duration
n_grok_steps: 40000      # main grokking phase steps (reliable for p=97 add)

# Evaluation schedules
# Cheap eval (train/val acc + loss): fine early, coarse later. This reduces the
# old timing quantization but cannot resolve transitions between evaluations.
eval_every:
  fine_until:      1000  # eval every fine_interval steps below this step
  fine_interval:   5
  coarse_interval: 25    # eval every this many steps thereafter
metrics_every:     1000  # expensive metrics (Fourier/Hessian/weight norms)

# Grokking detection, computed from the logged curves
grok_threshold: 0.95     # val_acc threshold (Minegishi P=95)
mem_threshold:  0.95     # train_acc threshold (Minegishi P=95)
grok_window:    2        # consecutive passing evals required for a genuine crossing

# Early stopping
# Applies to sparse, non-baseline conditions; the dense baseline always
# runs the full n_grok_steps. The grokked checkpoint + mask are saved before stop.
early_stop:
  enabled:  false
  patience: 500          # count includes the confirming grokking evaluation
