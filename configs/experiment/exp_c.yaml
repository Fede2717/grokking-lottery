# configs/experiment/exp_c.yaml
# ==============================
# Experiment C — ABLATION: weight-decay x sparsity grid, using ONE-SHOT MAGNITUDE
# PRUNING (NOT IMP). Tests whether weight decay and sparsity are substitutes or
# complements for closing the grokking gap. The short pretraining before pruning
# uses weight_decay=0 for ALL cells to remove the weight-decay confound; the grid
# value is applied only in the grokking phase.
name:        "exp_c"
description: "2D grid: weight_decay x sparsity (one-shot magnitude pruning)"

wd_values:
  - 1.0e-4
  - 1.0e-3
  - 5.0e-3
  - 1.0e-2

sparsity_values:
  - 0.0
  - 0.5
  - 0.8
  - 0.9
