# Root Hydra configuration. Sub-configs are composed via the defaults list.
# The default is a one-layer Transformer without LayerNorm, trained full-batch
# with AdamW and weight_decay=1.0.
#
# Usage:
#   python experiments/exp_b_lth_then_grok.py experiment=exp_b
#   python experiments/exp_b_lth_then_grok.py experiment=exp_b training.weight_decay=1e-2
#   python experiments/exp_b_lth_then_grok.py experiment=exp_b model=transformer_2l_preln
#   python experiments/exp_b_lth_then_grok.py experiment=exp_b dataset=modular_mul
#   python experiments/exp_b_lth_then_grok.py experiment=exp_b logging.backend=none

defaults:
  - dataset:    modular_add
  - model:      transformer_1l      # one layer, no LayerNorm
  - training:   default             # full-batch AdamW, wd=1.0
  - pruning:    imp
  - experiment: exp_b
  - _self_                          # allows root-level overrides

# Top-level execution control
seed:        42
num_seeds:   5          # number of independent seeds (CI plots / aggregate rows)
results_dir: "results"
use_amp:     false      # the default full-batch runs use fp32
device:      "auto"     # "auto" | "cuda" | "cpu"

# Optional top-Hessian-eigenvalue estimate using autograd HVPs.
compute_hessian: false

# Logging
# CSV is always written (results/<exp>/<run>/metrics.csv, long format) plus a per-run
# summary.json and aggregate output. Parallel launcher workers write per-seed
# aggregate shards to avoid shared-file races. `backend` only selects the viewer.
logging:
  backend: "tensorboard"   # tensorboard (default) | csv | none | wandb

# Weights & Biases (OPTIONAL, OFF by default)
# Enable only by setting logging.backend=wandb and wandb.enabled=true. The code
# does not log in or read WANDB_API_KEY; authentication must already be configured.
wandb:
  enabled:   false
  project:   "grokking-lottery"
  entity:    null
  tags:      []

# Reproducibility
# Initial model weights are saved to disk at step 0; LTH rewinding loads from that
# file rather than an in-memory state dictionary.
checkpoint:
  save_init:     true
  init_filename: "init_weights.pt"
