[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name        = "grokking-lottery"
version     = "0.2.0"
description = "Experiments on grokking with magnitude-pruned subnetworks."
readme      = "README.md"
license     = { text = "MIT" }
requires-python = ">=3.10"

# Runtime dependencies used by the package.
dependencies = [
    "torch>=2.1.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",

    # Experiment orchestration
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",

    # Logging (CSV is built-in; TensorBoard is the default live viewer)
    "tensorboard>=2.14.0",

    # Figures (offline plotting from CSV)
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
# Optional Weights & Biases viewer (opt-in: logging.backend=wandb, wandb.enabled=true)
wandb = ["wandb>=0.16.0"]

dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

# uv configuration
[tool.uv]
index-url = "https://pypi.org/simple"

[tool.uv.sources]
# For CUDA on Kaggle, install the matching torch wheel explicitly, e.g.:
#   uv pip install torch --index-url https://download.pytorch.org/whl/cu121
# (left commented so CPU-only dev machines resolve the default wheel)

# Hatch build
[tool.hatch.build.targets.wheel]
packages = ["src", "experiments", "analysis"]

# Ruff linter
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

# mypy
[tool.mypy]
python_version         = "3.10"
ignore_missing_imports = true
warn_unused_ignores    = true
